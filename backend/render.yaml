services:
  - type: web
    name: marketplace-haiti-api
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-haiti-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

databases:
  - name: marketplace-haiti-db
    plan: free
